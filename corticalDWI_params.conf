# corticalDWI pipeline parameters
# ──────────────────────────────────────────────────────────────────────────────
# This is the ONE file pipeline parameters live in — the single source of
# truth for the standalone cortical_*.sh scripts (sourced directly, via
# cortical_load_params.sh), the Snakemake pipeline (Snakefile/rules/*.smk,
# via cortical_config.py), and the Python tooling (cortical_browser.py,
# cortical_create_normative_data_from_tsf.py, cortical_zscore_tsf.py, via
# cortical_browser/cortical_browser_config.py). There is deliberately no
# separate YAML config for Snakemake any more — it used to have its own
# config.yaml, kept in sync by hand with this file, which was exactly the
# kind of two-files-for-one-setting confusion this file's format also causes
# less of on its own; whichever reader needs a value typed (an int thread
# count, a list of subjects) coerces it itself from the same plain text.
#
# Values here are repo-wide defaults.
#
# To override for a specific study, copy this file to $SUBJECTS_DIR and edit
# the values there. Study-level settings take priority over these defaults.
#
# Individual command-line arguments (a script's own CLI flags, or Snakemake's
# own --config) always win over both this file and the study-level copy.
# ──────────────────────────────────────────────────────────────────────────────

target_type=ico6_sym                    # surface template (fsLR-32k, ico6_sym, …)
nsteps=100                              # streamline integration steps
step_size=0.1                           # integration step size (mm)
tck_step_size=0.5                       # resampled streamline step size (mm)
max_length=10                           # max streamline length after warp (mm)
nDepths=30                              # cortical depth points to extract
csd_fixel_dir=csd_fixels_singletissue   # CSD fixel directory name (relative to dwi/)
mrds_fixel_dir=mrds_fixels              # MRDS fixel directory name (relative to dwi/mrds/)
angle=45                                # max fixel–streamline angle (degrees)

# Restrict a Snakemake run to specific subjects, e.g. sub-79291,sub-79292.
# Leave empty to auto-discover every sub-* directory in $SUBJECTS_DIR. Not
# read by the standalone cortical_*.sh scripts (each already takes its
# subject as its own CLI argument) — Snakemake-only.
subjects=

# Thread counts for the tool families confirmed (via ldd, 2026-08-25) to
# actually respect thread-count env vars — mdtmrds AND the MRDS package's own
# `dti` response-fitting tool (both called inside cortical_MRDS.sh) link
# libgomp directly -> OMP_NUM_THREADS; dipy_fit_dki/AMICO (cortical_DKI.sh,
# cortical_NODDI.sh) link OpenBLAS's pthreads build -> OPENBLAS_NUM_THREADS
# (OMP_NUM_THREADS set too, as OpenBLAS's own fallback). ANTs tools
# (N4BiasFieldCorrection/DenoiseImage/antsIntroduction/WarpImageMultiTransform)
# are NOT OpenMP-linked and ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS is unset on
# this host, so those already use all available cores by default. These
# families each get their own dedicated Snakemake threads: line per rule,
# because each is tuned/benchmarked separately (see
# reference_omp_threads_pinned_to_1 and reference_snakemake_cores_vs_jobs_flag
# memories for mrds/dki/noddi). Not read by the standalone cortical_*.sh
# scripts directly — Snakemake-only (it sets OMP_NUM_THREADS/OPENBLAS_NUM_THREADS
# from its own threads: resource when invoking them).
#
# mrds_threads doubles as the SGE slot request for cortical_MRDS.sh (see
# profiles/sge_don_clusterio/) — kept at 18 to match established real-world
# practice on this cluster (`fsl_sub -s smp,18`), not a benchmarked optimum:
# a quick isolated 45s-per-thread-count test suggested a wall past 8 threads,
# but that test's own numbers didn't match this same tool's real production
# throughput closely enough to trust over hands-on experience (short-window
# sampling likely doesn't amortize mdtmrds's per-run setup phase fairly across
# thread counts) — see reference_omp_threads_pinned_to_1 memory for the detail.
mrds_threads=12
python_threads=7

# Global default MRTRIX_NTHREADS/threads: for every OTHER Snakemake rule (the
# vast majority — a rule that's just a few MRtrix calls, no OMP/OpenBLAS tool
# of its own) that doesn't declare a threads: line of its own. Applied
# automatically in the Snakefile, once, right after every rules/*.smk is
# loaded. Safe to apply blanket: compute_streamlines' tckedit -nthreads 1 is a
# hardcoded CLI flag directly in that script (not controlled by
# MRTRIX_NTHREADS at all), and MRtrix CLI flags always take precedence over
# the env var regardless — confirmed via MRtrix's own docs — so this can
# never touch that rule's deliberate single-threaded determinism guarantee.
# Snakemake-only.
mrtrix_threads=7

# cortical_register_t1_to_dwi.sh calls the external inb_synthreg.sh (not part
# of this repo), which auto-detects a thread count via `nproc - 2` and passes
# it straight to mri_synthseg's TensorFlow backend with no minimum clamp.
# Under SGE, nproc inside a job reflects the granted slot count (confirmed on
# Don Clusterio, 2026-08-25) — with no threads: here, Snakemake defaults to 1
# slot, nproc reports 1, and `1 - 2 = -1` crashes mri_synthseg outright
# (TensorFlow: "Check failed: num_threads >= 1"). This doesn't fix
# inb_synthreg.sh's own missing clamp (a separate, real bug in that repo), but
# requesting a real slot count here means nproc never returns something that
# breaks its arithmetic in the first place. Snakemake-only.
register_threads=7

# Metrics used by cortical_browser.py and cortical_create_normative_data_from_tsf.py
# Each metric is <folder>/<name>, where <folder> is the FULL path — every
# directory name from the subject directory down — of the directory holding
# the .tsf. This is what tells apart metrics that several methods (or, for
# MRDS, different model-selection variants) produce under the same name, e.g.
# dwi/dti/fa vs dwi/dki/fa, or dwi/mrds/mrds_fixels/BIC/FA-par vs
# dwi/mrds/mrds_fixels/FTest/FA-par — however many folders deep. Maps to
# per-hemi TSF files named <folder>/{hemi}_{target_type}_<name>.tsf. Remove a
# metric from this list to exclude it from the browser and normative data
# creation.
#
# A trailing backslash continues the value onto the next line (same as bash's own
# line-continuation, since this file is also sourced directly by
# cortical_load_params.sh) — but the continuation line must NOT be indented, or
# bash reads it as a separate word/command instead of part of the assignment.
browser_metrics=dwi/dti/fa,dwi/dti/md,dwi/dti/ad,dwi/dti/rd,dwi/dti/cl,dwi/dti/cp,dwi/dti/cs,\
dwi/csd_fixels_singletissue/afd-par,dwi/csd_fixels_singletissue/afd-perp,\
dwi/dki/mk,dwi/dki/ak,dwi/dki/rk,\
mri/T1w_proc,mri/flair_proc,mri/T1w_proc_grad,mri/T1_over_FLAIR
