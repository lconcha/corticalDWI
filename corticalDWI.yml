name: corticalDWI
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - numpy=1.26.4
  - scipy=1.13.1
  - nibabel=5.3.2
  - matplotlib=3.9.4
  - pandas=2.3.1
  - astropy=6.0.1
  - dipy
  - snakemake
  - pip
  - pip:
    - scikit-fmm==2025.01.29
    - streamtracer
    - dmri-amico
    # cortical_glm_covariate.py's group-level significance test
    # (rules/zscore.smk's zscore_glm_stats). Pinned together: newer
    # netneurotools drops the civet submodule brainstat needs, and
    # netneurotools==0.2.3 only supports nilearn's pre-0.10.3 _fetch_files
    # location — see reference_brainstat_env_setup memory for the exact
    # ImportError chain if these drift.
    - brainstat
    - netneurotools==0.2.3
    - nilearn<0.10.3
