<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
// Mirrors the main tab's theme choice (see main.html) before first paint.
try {
  var __cbTheme = localStorage.getItem('cbTheme')
  if (__cbTheme === 'light' || __cbTheme === 'dark') document.documentElement.setAttribute('data-theme', __cbTheme)
} catch (e) {}
</script>
<title>CORTICAL BROWSER | DWI space — __SUBJ_ID__</title>
<style>
:root {
  /* The canvas itself stays dark in both themes, same rationale as main.html —
     only the #hdr chrome bar (this tab's "sidebar") follows the theme. */
  --accent-yellow: #F5C842;
  --chrome-bg: #1f1f1f; --chrome-text: #ccc;
  --hdr-bg: #2b2b2b; --hdr-border: #444444;
  --accent: #F5C842; --h3: #999999; --strong: #f0f0f0;
  --input-bg: #d9d9d9; --input-text: #1a1a1a; --input-border: #4d4d4d;
  --btn-bg: #3a3a3a; --btn-text: #ddd; --btn-border: #555555; --btn-bg-hover: #484848;
}
:root[data-theme="light"] {
  --chrome-bg: #ECEFF4; --chrome-text: #2E3440;
  --hdr-bg: #E5E9F0; --hdr-border: #D8DEE9;
  --accent: #5E81AC; --h3: #4C566A; --strong: #2E3440;
  --input-bg: #FFFFFF; --input-text: #2E3440; --input-border: #D8DEE9;
  --btn-bg: #D8DEE9; --btn-text: #2E3440; --btn-border: #4C566A; --btn-bg-hover: #CCD4E2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--chrome-bg); color: var(--chrome-text);
  font: 11px/1.4 -apple-system, "Segoe UI", Arial, sans-serif;
  height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
}
#hdr {
  flex-shrink: 0; padding: 6px 10px; background: var(--hdr-bg); border-bottom: 1px solid var(--hdr-border);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
}
.apptitle { font-weight: bold; color: var(--accent); font-size: 12px; letter-spacing: 0.5px; }
.space { color: var(--h3); font-size: 10px; white-space: nowrap; }
.subj { font-weight: bold; color: var(--strong); font-size: 12px; }
button.cbtn {
  background: var(--btn-bg); color: var(--btn-text); border: 1px solid var(--btn-border);
  border-radius: 3px; padding: 2px 8px; font-size: 10px; cursor: pointer;
}
button.cbtn:hover { background: var(--btn-bg-hover); }
button.cbtn:disabled { opacity: 0.4; cursor: default; }
label { display: flex; align-items: center; gap: 4px; color: var(--h3); white-space: nowrap; }
select {
  background: var(--input-bg); color: var(--input-text); border: 1px solid var(--input-border);
  border-radius: 3px; padding: 1px 3px; font-size: 10px;
}
input[type=number] {
  background: var(--input-bg); color: var(--input-text); border: 1px solid var(--input-border);
  border-radius: 3px; padding: 1px 4px; font-size: 10px; width: 64px;
  -moz-appearance: textfield;
}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { display: none; }
#status { color: var(--h3); font-size: 11px; font-family: monospace; margin-left: auto; white-space: pre; }
#canvas-wrap { flex: 1; min-height: 0; position: relative; background: #0a0a0a; }
canvas { display: block; width: 100% !important; height: 100% !important; outline: none; }
</style>
</head>
<body>
<div id="hdr">
  <span class="apptitle">CORTICAL BROWSER</span>
  <span class="space">DWI space</span>
  <span class="subj">__SUBJ_ID__</span>
  <button class="cbtn" id="dwiStreamVisBtn" title="Show/hide the DWI-space streamlines">Streamlines: on</button>
  <button class="cbtn" id="dwiStreamModeBtn" title="Toggle between every streamline and only the ones seeded from the selected vertex/rings">Mode: selected</button>
  <label title="Volume shown in the orthoslices">Volume <select id="dwiVolSel"></select></label>
  <input type="file" id="dwiVolFile" accept=".nii,.nii.gz,.gz,.mgz,.mgh,.hdr,.img" style="display:none">
  <label title="Colormap for the shown volume">cmap <select id="dwiCmapSel"></select></label>
  <label title="Shown volume's color min (clip)">min <input type="number" id="dwiClipMin" step="any"></label>
  <label title="Shown volume's color max (clip)">max <input type="number" id="dwiClipMax" step="any"></label>
  <span id="status">waiting for a vertex to be selected in the main tab…</span>
</div>
<div id="canvas-wrap"><canvas id="gl-dwi"></canvas></div>

<script type="module" src="/static/dwi.js?v=__CACHE_BUST__"></script>
</body>
</html>
